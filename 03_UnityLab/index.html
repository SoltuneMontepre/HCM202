<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Unity Lab — Bạn xử lý khác biệt như thế nào?</title>
  <meta name="description" content="Mini-game 3 tình huống vận dụng tư tưởng Hồ Chí Minh về đại đoàn kết dân tộc. Dự án học tập, môn Tư tưởng Hồ Chí Minh.">
  <meta name="theme-color" content="#5B0808">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <!-- Fonts (SIL OFL): Phudu for headlines, Be Vietnam Pro for text -->
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Phudu:wght@600;800;900&display=swap&subset=vietnamese" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Motion (all optional: the app works without them) — GSAP + ScrollTrigger + SplitText, Lenis, canvas-confetti -->
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script defer src="assets/media.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <div class="bg-drum" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- screen-change wipe (animated by script.js; hidden when motion is off) -->
  <div class="wipe" id="wipe" aria-hidden="true">
    <div class="wipe-panel" id="wipePanel"><span class="wipe-mark">UNITY<b>LAB</b></span></div>
  </div>

  <header class="topbar" id="topbar" hidden>
    <button class="brand" type="button" id="homeLink" aria-label="Về màn hình đầu">UNITY<span>LAB</span></button>
    <div class="progress" aria-label="Tiến độ">
      <span class="progress-text" id="progressText">1/3</span>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </header>

  <main id="app" tabindex="-1" aria-live="polite"></main>

  <button class="float-cta" id="floatCta" type="button" hidden>Bắt đầu <span aria-hidden="true">→</span></button>

  <noscript><p class="noscript">Unity Lab cần bật JavaScript để chạy.</p></noscript>
</body>
</html>
